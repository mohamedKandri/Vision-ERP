[package]
name = "burger-os"
version = "0.1.0"
description = "BURGER OS - local-first POS and back office"
edition = "2021"

[lib]
name = "burger_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
argon2 = "0.5"
rand = "0.8"
thiserror = "2"
hex = "0.4"
base64 = "0.22"
png = "0.17"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["net", "sync", "rt-multi-thread", "macros", "time"] }
ureq = { version = "2", default-features = false, features = ["json"] }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
sha2 = "0.10"
if-addrs = "0.13"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_Security"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
